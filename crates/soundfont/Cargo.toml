[package]
name = "filmcraft-soundfont"
description = "SoundFont (SF2) instruments for FilmCraft's soundtrack engine: a hostile-input check in front of rustysynth (MIT, pure Rust), a General MIDI instrument bank with the oscillators as the fallback, and the GeneralUser GS download pin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Layer L2: the music engine's instrument interface (audio-dsp, L1) played on SoundFonts.
[dependencies]
filmcraft-audio-dsp = { workspace = true }
# MIT, pure Rust. Its loader reads sample data through one `unsafe` cast that is only sound for an
# even `smpl` size, and indexes with input-derived numbers: every file passes `check` first (see
# the README), and every call into it runs under `catch_unwind`.
rustysynth = "=1.3.7"

[dev-dependencies]
filmcraft-time = { workspace = true }
