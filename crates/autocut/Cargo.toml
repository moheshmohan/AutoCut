[package]
name = "filmcraft-autocut"
description = "AutoCut: prompt-driven automated editing. A local LLM classifies the request, deterministic planners turn it into engine commands, and a cloud supervisor (Anthropic) handles the rest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-time = { workspace = true }
# showcase QA: reading the exported mix and metering it
filmcraft-media = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
# the privacy pass names what it hides (faces, plates)
filmcraft-vision = { workspace = true }
# the balanced-JSON reading of model answers, shared with the scene index
filmcraft-scenes = { workspace = true }
serde = { workspace = true }
# float_roundtrip: a plan read and written back (showcase-plan) keeps every number exactly
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = { version = "0.0.2-alpha" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
filmcraft-project = { workspace = true }
