[package]
name = "filmcraft-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle; Metal on macOS, else the CPU). Off by default and in wasm builds.
whisper = ["filmcraft-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmcraft-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M, natural voice cloning with VoxCPM, cloned voices
# speaking Malayalam with IndicF5 (all on candle: Metal on macOS, else the CPU) and their
# downloads.
neural-voices = ["filmcraft-tts/kokoro", "filmcraft-tts/voxcpm", "filmcraft-tts/indicf5", "speech-download"]
# Neural text to music: ACE-Step 1.5 on candle (Metal on macOS) and its download.
neural-music = ["filmcraft-acestep/model", "speech-download"]
# Automatic privacy blur: the YuNet face and LPD-YuNet plate detectors (the GPU on macOS, else
# the CPU) and their download.
privacy-models = ["filmcraft-vision/model", "speech-download"]
# Voice isolation: the DeepFilterNet 3 download (the network itself is plain Rust and always built).
voice-model = ["speech-download"]
# The scene index's networks: TransNetV2 shot boundaries, Qwen3-VL descriptions, SigLIP 2
# embeddings and the CLIP aesthetic head (candle; Metal on macOS, else the CPU) and their download.
scene-models = ["filmcraft-scenes/model", "speech-download"]

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
# the GPU lock the voice lab's big models run under
filmcraft-locks = { workspace = true }
filmcraft-scopes = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-mxf = { workspace = true }
filmcraft-format = { workspace = true }
filmcraft-interchange = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-speech = { workspace = true }
filmcraft-tts = { workspace = true }
filmcraft-templates = { workspace = true }
filmcraft-acestep = { workspace = true }
filmcraft-soundfont = { workspace = true }
filmcraft-vision = { workspace = true }
# voice isolation (DeepFilterNet 3, plain Rust) behind the Voice Isolation and Enhance Voice effects
filmcraft-voice = { workspace = true }
filmcraft-scenes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# export_tools::file_safe keeps the combining marks of a name's letters (Apache-2.0).
unicode-general-category = "1.1"
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"
filmcraft-isobmff = { workspace = true }
# the kept depth maps (`depth.rs`), deflated (pure Rust)
miniz_oxide = "0.8"

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-dng = { workspace = true, features = ["writer"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[[example]]
name = "clone_eval"
required-features = ["neural-voices", "whisper"]

[[example]]
name = "narration_recheck"
required-features = ["whisper"]
