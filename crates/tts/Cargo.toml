[package]
name = "filmcraft-tts"
description = "FilmCraft text to speech: the Voice trait, the voice catalogue, script parsing (pause markers), the built-in formant voice, (feature kokoro) Kokoro-82M neural voices and OpenVoice cloning on candle, and (feature voxcpm) VoxCPM zero-shot voice cloning on candle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Kokoro-82M neural voices via candle (pure Rust; Metal on macOS, else the CPU). Off by default and in wasm builds.
kokoro = ["dep:candle-core", "dep:candle-nn", "dep:zip", "dep:serde_json", "dep:sha2", "dep:filmcraft-tts-text", "dep:filmcraft-audio-dsp"]
# VoxCPM zero-shot voice cloning on candle (pure Rust; builds on the Kokoro stack's loaders and
# text front end). Off by default and in wasm builds. On macOS it runs on the GPU through
# candle's Metal backend (below), falling back to the CPU without one.
voxcpm = ["kokoro", "dep:rayon", "dep:filmcraft-locks"]
# IndicF5 (F5-TTS + Vocos) on candle: cloned voices speaking Malayalam and other Indian
# languages. Builds on the VoxCPM stack's safetensors reader, device choice and GPU lock.
indicf5 = ["voxcpm"]

[dependencies]
filmcraft-tts-text = { workspace = true, optional = true }
filmcraft-audio-dsp = { workspace = true, optional = true }
# the GPU lock VoxCPM speaks under, so parallel sessions take turns
filmcraft-locks = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
# narration cache keys (pure Rust; also builds for wasm)
sha2 = "0.10"
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
zip = { version = "7", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }

# On macOS candle comes with its Metal backend, which Kokoro, OpenVoice, VoxCPM and IndicF5 run
# on (the CPU being the fallback).
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", default-features = false, features = ["metal"], optional = true }
candle-nn = { version = "0.9", default-features = false, features = ["metal"], optional = true }

[[example]]
name = "kokoro_say"
required-features = ["kokoro"]

[[example]]
name = "narrate"
required-features = ["kokoro"]

[[example]]
name = "clone_check"
required-features = ["kokoro"]

[[example]]
name = "voxcpm_say"
required-features = ["voxcpm"]
 
[[example]]
name = "voice_similarity"
required-features = ["kokoro"]

[[example]]
name = "f5_say"
required-features = ["indicf5"]

[[example]]
name = "ml_lab"
required-features = ["indicf5"]

[dev-dependencies]
# the Malayalam lab (`examples/ml_lab.rs`) hears its readings with a speech model
filmcraft-speech = { workspace = true, features = ["whisper"] }
