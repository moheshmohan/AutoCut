[package]
name = "filmcraft-youtube"
description = "YouTube for the editor: channels signed in through filmcraft-oauth (one sign-in per channel, Brand Accounts too), resumable uploads with thumbnails and playlists, quota accounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-oauth = { workspace = true }
# an MP4/MOV's header (picture size, length) for the Shorts hint, without reading the file
filmcraft-isobmff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# HTTPS to the YouTube Data API: pure-Rust TLS (rustls + RustCrypto), OS certificate
# verification, the same stack as filmcraft-oauth and filmcraft-gphotos.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = { version = "0.0.2-alpha" }
# keys of the upload sessions kept across runs (a re-run resumes instead of starting again)
sha2 = "0.10"
