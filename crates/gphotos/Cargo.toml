[package]
name = "filmcraft-gphotos"
description = "Google Photos for the editor: the sign-in (on filmcraft-oauth), the Photos Picker API, an import cache, uploads and albums"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-oauth = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = { version = "0.0.2-alpha" }
