[package]
name = "filmcraft-cli"
description = "FilmCraft headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmcraft-cli"
path = "src/main.rs"

[features]
# AutoCut build: speech-to-text (Whisper) and natural narration voices (Kokoro) ship by default,
# so transcript- and narration-driven automation works out of the box (upstream leaves them off
# in release builds); model weights still download on demand with consent.
default = ["whisper", "neural-voices", "neural-music", "privacy-models"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]
# Neural text to music (ACE-Step 1.5 on candle, Metal on macOS; the model downloads on demand with consent).
neural-music = ["filmcraft-engine/neural-music"]
# Automatic privacy blur (Clip ▸ Auto Redact Faces and Plates…): the YuNet and LPD-YuNet detectors
# on candle (CPU; 4.4 MB, downloaded on demand with consent).
privacy-models = ["filmcraft-engine/privacy-models"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-platform = { workspace = true }
filmcraft-mxf = { workspace = true }
filmcraft-mpegts = { workspace = true }
filmcraft-ogg = { workspace = true }
filmcraft-automation = { workspace = true }
filmcraft-autocut = { workspace = true }
filmcraft-gphotos = { workspace = true }
filmcraft-youtube = { workspace = true }
filmcraft-instagram = { workspace = true }
filmcraft-screenagent = { workspace = true }
filmcraft-locks = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
# music tests: a tiny SoundFont made in code
filmcraft-soundfont = { workspace = true }
