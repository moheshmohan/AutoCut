[package]
name = "filmcraft-cli"
description = "FilmCraft headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmcraft-cli"
path = "src/main.rs"

[features]
# AutoCut build: speech-to-text (Whisper) and natural narration voices (Kokoro) ship by default,
# so transcript- and narration-driven automation works out of the box (upstream leaves them off
# in release builds); model weights still download on demand with consent.
default = ["whisper", "neural-voices", "neural-music", "privacy-models", "voice-model", "scene-models"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper (Metal on macOS, else the CPU), and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M; Metal on macOS, else the CPU; downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]
# Neural text to music (ACE-Step 1.5 on candle, Metal on macOS; the model downloads on demand with consent).
neural-music = ["filmcraft-engine/neural-music"]
# Automatic privacy blur (Clip ▸ Auto Redact Faces and Plates…): the YuNet and LPD-YuNet detectors
# (the GPU on macOS, else the CPU; 4.4 MB, downloaded on demand with consent).
privacy-models = ["filmcraft-engine/privacy-models"]
# Voice isolation (Voice Isolation, Enhance Voice, `audio enhance`): the DeepFilterNet 3 download
# (8 MB, MIT/Apache-2.0, on demand with consent); the network is plain Rust and always built.
voice-model = ["filmcraft-engine/voice-model"]
# The scene index (media.analyzeScenes): TransNetV2 cuts, Qwen3-VL shot descriptions, SigLIP 2
# search, the LAION aesthetic score (Metal on macOS, else the CPU; downloaded on demand with consent).
scene-models = ["filmcraft-engine/scene-models"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-platform = { workspace = true }
filmcraft-mxf = { workspace = true }
filmcraft-mpegts = { workspace = true }
filmcraft-ogg = { workspace = true }
filmcraft-automation = { workspace = true }
filmcraft-autocut = { workspace = true }
filmcraft-gphotos = { workspace = true }
filmcraft-youtube = { workspace = true }
filmcraft-instagram = { workspace = true }
filmcraft-screenagent = { workspace = true }
filmcraft-locks = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The GPU export renderer (Export ▸ GPU rendering, Auto by default; `docs/gpu.md`) needs a wgpu
# backend. `filmcraft-gpu` asks for none and the desktop app gets them through eframe, so a CLI
# built on its own (`cargo build -p filmcraft-cli`) had no adapter and rendered every export on
# the CPU. The platform's native backends, enabled here:
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
# music tests: a tiny SoundFont made in code
filmcraft-soundfont = { workspace = true }
