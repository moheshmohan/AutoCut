[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

[lints]
workspace = true

[features]
# AutoCut build: speech-to-text (Text panel ▸ Transcribe) with Whisper, and model
# downloads, on by default so transcript-driven automation works out of the box (upstream
# leaves them off in release builds).
default = ["whisper", "neural-voices", "neural-music", "privacy-models"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper (Metal on macOS, else the CPU), and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M; Metal on macOS, else the CPU; downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]
# Neural text to music (ACE-Step 1.5 on candle, Metal on macOS; the model downloads on demand with consent).
neural-music = ["filmcraft-engine/neural-music"]
# Automatic privacy blur (Clip ▸ Auto Redact Faces and Plates…): the YuNet and LPD-YuNet detectors
# (the GPU on macOS, else the CPU; 4.4 MB, downloaded on demand with consent).
privacy-models = ["filmcraft-engine/privacy-models"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
# Export ▸ Upload to Google Photos (`photos.upload`): the uploader the session gets.
filmcraft-gphotos = { workspace = true }
filmcraft-youtube = { workspace = true }
filmcraft-instagram = { workspace = true }
# Sequence ▸ Make a Showcase… / the Showcase panel (`autocut.*`): the showcase jobs' host.
filmcraft-autocut = { workspace = true }
# A Google Photos album as a showcase's seed: the picker driven by the screen agent.
filmcraft-automation = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
